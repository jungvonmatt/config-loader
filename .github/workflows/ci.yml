name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 22
          cache: true
      - run: vp run lint
      - run: vp run test:types
      - run: vp run build
      - run: vp test run --coverage
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: jungvonmatt_config-loader
          SONAR_ORGANIZATION: jungvonmatt
        with:
          args: >
            -Dsonar.projectKey=jungvonmatt_config-loader
            -Dsonar.organization=jungvonmatt
            -Dsonar.host.url=https://sonarcloud.io

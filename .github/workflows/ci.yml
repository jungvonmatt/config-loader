name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24
          run-install: false
          cache: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run audit
      - run: vp run lint
      - run: vp run test:types
      - run: vp run build
      - run: vp test run --coverage
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: jungvonmatt_config-loader
          SONAR_ORGANIZATION: jungvonmatt
        with:
          args: >
            -Dsonar.projectKey=jungvonmatt_config-loader
            -Dsonar.organization=jungvonmatt
            -Dsonar.host.url=https://sonarcloud.io
